name: Publish NuGet Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SimpleORM.Net.slnx

      - name: Build
        run: >
          dotnet build SimpleORM.Net.slnx
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test SimpleORM.Net.slnx
          --configuration Release
          --no-build

      - name: Pack
        run: >
          dotnet pack SimpleORM.Net.slnx
          --configuration Release
          --no-build
          --output ./artifacts

      - name: Publish
        shell: bash
        run: |
          find ./artifacts \
            -name "*.nupkg" \
            ! -name "*.snupkg" \
            -print0 |
          while IFS= read -r -d '' package; do
            dotnet nuget push "$package" \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --source "https://api.nuget.org/v3/index.json" \
              --skip-duplicate
          done